name: Build Android Xposed APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Force Injection of Strict Official Manifest
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application android:hasCode="true" android:label="Crimson Graphics">
                <meta-data android:name="xposedmodule" android:value="true" />
                <meta-data android:name="xposeddescription" android:value="Unlocks Ultra/Extreme graphics presets." />
                <meta-data android:name="xposedminversion" android:value="82" />
            </application>
        </manifest>
        EOF

    - name: Build Debug APK with Wrapper
      run: gradle assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CrimsonGraphics-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
