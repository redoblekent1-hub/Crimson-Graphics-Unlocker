name: Build Android Xposed APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Gradle Wrapper Engine
      run: gradle wrapper --gradle-version 8.2 --distribution-type bin

    - name: Build Debug APK with Wrapper
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CrimsonGraphics-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
