name: Build Android Xposed APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Force Injection of Valid Manifest File
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com">' >> app/src/main/AndroidManifest.xml
        echo '    <application android:hasCode="true" android:label="Crimson Graphics">' >> app/src/main/AndroidManifest.xml
        echo '        <meta-data android:name="xposedmodule" android:value="true" />' >> app/src/main/AndroidManifest.xml
        echo '        <meta-data android:name="xposeddescription" android:value="Unlocks Ultra/Extreme graphics presets." />' >> app/src/main/AndroidManifest.xml
        echo '        <meta-data android:name="xposedminversion" android:value="82" />' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

    - name: Build Debug APK with Wrapper
      run: gradle assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CrimsonGraphics-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
