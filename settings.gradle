pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Switched out the timed-out server for reliable fallback mirrors
        maven { url "https://jitpack.io" }
        maven { url "https://sonatype.org" }
    }
}
rootProject.name = "CrimsonGraphicsUnlocker"
include ':app'
