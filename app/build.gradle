plugins {
    id 'com.android.application'
}

android {
    namespace 'io.iicebear.crimson.graphics'
    compileSdk 34

    defaultConfig {
        applicationId "io.iicebear.crimson.graphics"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0-Graphics"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Switched to the modern, active LSPosed-maintained Xposed API archive link
    compileOnly 'org.lsposed.lsposed:api:93'
}
