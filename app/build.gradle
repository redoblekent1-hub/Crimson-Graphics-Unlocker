plugins {
    id 'com.android.application'
}

android {
    namespace 'io.iicebear.crimson.graphics'
    compileSdk 34

    defaultConfig {
        applicationId "io.iicebear.crimson.graphics"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0-Graphics"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Bypasses the XML validation step entirely by creating a clean file during compilation
project.afterEvaluate {
    tasks.named("processDebugMainManifest").configure {
        doLast {
            def manifestFile = new File(manifestOutputFile.get().asFile.parent, "AndroidManifest.xml")
            if (manifestFile.exists()) {
                manifestFile.text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com">
    <application android:hasCode="true" android:label="Crimson Graphics">
        <meta-data android:name="xposedmodule" android:value="true" />
        <meta-data android:name="xposeddescription" android:value="Unlocks Ultra/Extreme graphics presets." />
        <meta-data android:name="xposedminversion" android:value="82" />
    </application>
</manifest>"""
            }
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
}
