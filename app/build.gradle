plugins {
    id 'com.android.application'
}

android {
    namespace 'io.iicebear.crimson.graphics'
    compileSdk 34

    defaultConfig {
        applicationId "io.iicebear.crimson.graphics"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0-Graphics"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Forces the compiler to automatically write the layout tags during compilation
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.processManifestProvider.get().doLast { manifest ->
                def manifestFile = manifest.manifestOutputFile.get().asFile
                if (manifestFile.exists()) {
                    def text = manifestFile.text
                    def metaDataBlock = '''
        <meta-data android:name="xposedmodule" android:value="true" />
        <meta-data android:name="xposeddescription" android:value="Unlocks Ultra/Extreme graphics presets and flagship profiles." />
        <meta-data android:name="xposedminversion" android:value="82" />
                    '''
                    text = text.replace("</application>", "${metaDataBlock}\n    </application>")
                    manifestFile.text = text
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
}
